name: Publish Docker image

# linux/arm64 only, matching docker-compose.yml/Dockerfile (spec §2, LOCKED:
# Oracle Cloud Ampere A1) -- GitHub's runners build this natively enough via
# QEMU; nothing here needs the arm64 emulation this repo's build sandbox
# lacks.

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Safety net for the QEMU-emulation crash class documented in the
    # Dockerfile/docs/decisions.md: a crashed-but-not-exited qemu process can
    # hang the build step indefinitely with no error surfaced, as opposed to
    # failing fast. 15m is generous headroom over this workflow's normal
    # multi-minute run time.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
