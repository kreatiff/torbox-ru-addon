services:
  postgres:
    image: postgres:16
    platform: linux/arm64
    restart: unless-stopped
    environment:
      # Fallbacks match .env.example; override in .env for any real deployment.
      POSTGRES_USER: ${POSTGRES_USER:-torbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-torbox_ru}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-torbox} -d ${POSTGRES_DB:-torbox_ru}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    # Not exposed on purpose: only `app` needs to reach Postgres, over the
    # compose-internal network. Nothing here should be reachable from the
    # Cloudflare Tunnel — that only points at `app` (from Milestone 3 on).

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    platform: linux/arm64
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL:-info}
    # Not exposed on purpose, same reasoning as `postgres` above -- only
    # `app` needs to reach it (docs/rutracker-scraper-plan.md's manual
    # Download action), over the compose-internal network, as
    # http://flaresolverr:8191. It drives a real headless browser capable
    # of fetching arbitrary URLs; no reason to put that on the host network
    # or behind the Cloudflare Tunnel. No `depends_on` from `app`: this is
    # an optional integration (fetchMagnetLink degrades to a clear error if
    # unreachable), not something the addon's core startup should block on.

  app:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    # Long-running addon server (manifest/stream/play) that also runs its
    # own ingest scheduler (INGEST_INTERVAL_MINUTES below). Manual triggers
    # still work alongside it: the admin UI's "Trigger Ingest Run Now"
    # button, or `docker compose exec app node dist/ingest/runOnce.js` (not
    # `npm run ingest` -- that invokes tsx against TypeScript source, and this
    # image only ships compiled dist/ output plus production dependencies).
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      # Explicit (not env_file:) so this works the same whether the values
      # come from a local .env (Compose still auto-loads one from the
      # project directory if present — nothing else here changes), from
      # the shell running `docker compose up`, or from a stack's own
      # "Environment variables" UI (Portainer, Swarm, etc.), none of which
      # can load a gitignored .env file that was never pushed to the repo.
      TORBOX_API_KEY: ${TORBOX_API_KEY}
      DATABASE_URL: ${DATABASE_URL:-postgresql://torbox:changeme@postgres:5432/torbox_ru}
      TORBOX_REQUEST_DELAY_MS: ${TORBOX_REQUEST_DELAY_MS:-250}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # --- Milestone 3 (src/http, the addon) ---
      ADDON_TOKEN: ${ADDON_TOKEN}
      PUBLIC_BASE: ${PUBLIC_BASE}
      PORT: ${PORT:-3000}
      NOT_WEB_READY_EXTENSIONS: ${NOT_WEB_READY_EXTENSIONS:-ts}
      # --- Milestone 4 (src/ui, admin UI & metadata) ---
      # No defaults for ADMIN_USER/ADMIN_PASS -- same reasoning as
      # ADDON_TOKEN: a guessable admin password reachable from the same
      # public tunnel is a real vulnerability, not a convenience.
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # --- LLM-based auto-proposal ---
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
      OPENCODE_ZEN_MODEL: ${OPENCODE_ZEN_MODEL:-deepseek-v4-flash-free}
      OPENCODE_ZEN_REQUEST_DELAY_MS: ${OPENCODE_ZEN_REQUEST_DELAY_MS:-1000}
      # --- RuTracker feed scraper (docs/rutracker-scraper-plan.md) ---
      RUTRACKER_FEED_URLS: ${RUTRACKER_FEED_URLS:-}
      RUTRACKER_STORE_UNMATCHED: ${RUTRACKER_STORE_UNMATCHED:-false}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-http://flaresolverr:8191}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # --- Ingest scheduler ---
      INGEST_INTERVAL_MINUTES: ${INGEST_INTERVAL_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
